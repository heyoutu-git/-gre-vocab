server:
  port: 8080
  servlet:
    context-path: /gre-vocab

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB
  datasource:
    url: jdbc:mysql://localhost:3306/gre_vocab?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:CHANGE_ME_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.grevocab
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  # 通过环境变量 JWT_SECRET 注入（>=32 字节），仓库不保存任何真实密钥
  secret: "${JWT_SECRET:CHANGE_ME_DEV_JWT_SECRET_0123456789abcdef}"
  expiration: 86400000

app:
  upload:
    enabled: false
  pdf-parser:
    # 服务器上用来执行 tools/ingest_pdf.py 的 Python 解释器；188 默认路径为 C:/Python/Python314/python.exe
    # 如需覆盖，可通过环境变量 PDF_PARSER_PYTHON 指定路径（如 D:/Python/python.exe）
    python-path: ${PDF_PARSER_PYTHON:C:/Python/Python314/python.exe}
    timeout-seconds: 120
  crypto:
    # 加密根密钥：通过环境变量 APP_CRYPTO_SECRET 注入（>=32 字符），仓库不保存任何真实密钥。
    secret: ${APP_CRYPTO_SECRET:CHANGE_ME_DEV_CRYPTO_SECRET_0123456789abcdef}
