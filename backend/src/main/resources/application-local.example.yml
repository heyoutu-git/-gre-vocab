# 本地开发环境变量示例
# 复制为 application-local.yml（已被 .gitignore 忽略，严禁提交真实值），
# 并在启动时激活：--spring.profiles.active=local
# 或者直接用系统环境变量 / 启动脚本注入以下变量。

spring:
  datasource:
    # 本机 MySQL root 密码（切勿提交真实值）
    password: ${SPRING_DATASOURCE_PASSWORD:your-local-db-password}

jwt:
  # 任意 >=32 字节随机字符串
  secret: "${JWT_SECRET:your-jwt-secret-at-least-32-bytes-long!!}"

app:
  crypto:
    # 用于腾讯云 TTS 凭据等敏感数据 AES 加密的根密钥（>=32 字符）
    secret: ${APP_CRYPTO_SECRET:your-crypto-root-secret-at-least-32-chars!!}
  pdf-parser:
    # PDF 解析/OCR 兜底用 Python 解释器路径（需 pymupdf + rapidocr-onnxruntime）
    python-path: ${PDF_PARSER_PYTHON:C:/Python/Python314/python.exe}
